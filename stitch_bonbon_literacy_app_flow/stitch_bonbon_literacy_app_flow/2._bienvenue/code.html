<!-- Top Visual Banner: Warm Literacy Celebration -->
<div class="relative w-full rounded-2xl overflow-hidden shadow-md bg-surface-container-high aspect-[16/10] flex flex-col justify-end">
<img class="absolute inset-0 w-full h-full object-cover" data-alt="Two joyful, empowered young West African women smiling warmly directly at the camera, wearing vibrant green patterned wax print skirts, proudly holding up small chalk slates inscribed with handwritten French letters 'A B C D E F' and numbers '1 2 3'. Bright natural daytime outdoor lighting, village learning circle setting with soft natural earth tones and lush green backdrop, radiating pride, sisterhood, dignity, and educational accomplishment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBDfKv7PQ3RSUVOolUfqQKzplTp5l07ikw9Iup-33TtmuVHHrx9v1EkgtVGcEdm2ITch9_ZgcO6f0VNrXkxce_ggQRDN5mwHiLF0dD0iU_d3x1KUNaAL1MN07E2LJOz3E8bWHovWpu7RqDI6Db1qh7n0cMDm1BMOwGL6uFHFTruZWuII7kDqf0EG6Om_0jv8xFfmbBkRJ1muoqRPLYK2eSiog26qVBSUmjOs_eiUDwMr3Ciocfc3G-mpg"/>
<div class="absolute inset-0 bg-gradient-to-t from-on-surface/70 via-on-surface/20 to-transparent"></div>
<!-- Small Encouraging Floating Tag -->
<div class="relative z-10 m-space-md inline-flex items-center gap-space-xs self-start bg-surface-container-lowest/95 backdrop-blur-md px-3.5 py-1.5 rounded-full shadow-sm text-primary font-label-sm text-label-sm">
<span class="material-symbols-outlined text-secondary text-[20px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span>Cercle d'apprentissage</span>
</div>
</div>
<!-- Main Greeting & Phonics Guidance -->
<div class="flex flex-col items-center text-center gap-space-sm px-space-xs">
<!-- Brand Motifs Badge -->
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary mb-1 shadow-sm">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">local_library</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">
      Bienvenue à Bonbon !
    </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[320px] leading-relaxed">
      Apprenons à lire et à écrire ensemble, pas à pas.
    </p>
</div>
<!-- Audio Guidance Pill (Critical Dual-Coding Accessibility) -->
<div class="flex justify-center w-full my-space-xs">
<button aria-label="Écouter la bienvenue en français" class="group relative min-h-[56px] px-6 py-3 rounded-full bg-surface-container-low active:bg-secondary-fixed text-primary flex items-center justify-center gap-3 shadow-md active:translate-y-0.5 transition-all duration-150 cursor-pointer" id="listen-button" type="button">
<div class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center transition-transform group-active:scale-90" id="speaker-icon-wrapper">
<span class="material-symbols-outlined text-[26px]" id="speaker-icon">volume_up</span>
</div>
<div class="flex flex-col text-left">
<span class="font-label-lg text-label-lg text-primary leading-tight">Écouter</span>
<span class="font-label-sm text-label-sm text-on-surface-variant" id="listen-status">Français parlé</span>
</div>
<!-- Animated sound waves hint -->
<div class="hidden items-center gap-1 pl-1" id="sound-waves">
<span class="w-1 h-3 bg-secondary rounded-full animate-pulse"></span>
<span class="w-1 h-5 bg-secondary rounded-full animate-pulse [animation-delay:150ms]"></span>
<span class="w-1 h-2 bg-secondary rounded-full animate-pulse [animation-delay:300ms]"></span>
</div>
</button>
</div>
<!-- Pedagogical Visual Aid: Today's Focus -->
<div class="bg-surface-container rounded-2xl p-space-md flex items-center justify-between shadow-sm">
<div class="flex items-center gap-space-md">
<div class="w-12 h-12 rounded-xl bg-surface-container-lowest flex items-center justify-center text-primary font-headline-sm text-headline-sm shadow-sm">
        Aa
      </div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Première leçon</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Les voyelles &amp; les sons</span>
</div>
</div>
<div class="w-9 h-9 rounded-full bg-primary-fixed-dim/40 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]">play_arrow</span>
</div>
</div>
<!-- Primary Action: Continue -->
<div class="flex flex-col gap-space-xs mt-auto pt-space-sm">
<button class="min-h-[56px] w-full py-4 px-6 rounded-2xl bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-3 shadow-lg shadow-primary/20 active:translate-y-1 transition-transform cursor-pointer" id="next-step-btn" type="button">
<span>Suivant</span>
<span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>
<span class="font-label-sm text-label-sm text-outline text-center mt-1">Appuie pour commencer</span>
</div>
</div>
<script>
  (function() {
    const listenBtn = document.getElementById('listen-button');
    const speakerIcon = document.getElementById('speaker-icon');
    const listenStatus = document.getElementById('listen-status');
    const soundWaves = document.getElementById('sound-waves');
    let isPlaying = false;

    if (listenBtn) {
      listenBtn.addEventListener('click', function() {
        if (!('speechSynthesis' in window)) {
          alert("Bienvenue à Bonbon ! Apprenons à lire et à écrire ensemble.");
          return;
        }

        if (isPlaying) {
          window.speechSynthesis.cancel();
          resetState();
          return;
        }

        const utterance = new SpeechSynthesisUtterance("Bienvenue à Bonbon ! Apprenons à lire et à écrire ensemble.");
        utterance.lang = 'fr-FR';
        utterance.rate = 0.85; // Slightly slower, highly clear cadence for learner comprehension

        utterance.onstart = function() {
          isPlaying = true;
          speakerIcon.innerText = 'graphic_eq';
          listenStatus.innerText = 'Lecture en cours...';
          soundWaves.classList.remove('hidden');
          soundWaves.classList.add('flex');
        };

        utterance.onend = function() {
          resetState();
        };

        utterance.onerror = function() {
          resetState();
        };

        window.speechSynthesis.speak(utterance);
      });
    }

    function resetState() {
      isPlaying = false;
      if (speakerIcon) speakerIcon.innerText = 'volume_up';
      if (listenStatus) listenStatus.innerText = 'Français parlé';
      if (soundWaves) {
        soundWaves.classList.add('hidden');
        soundWaves.classList.remove('flex');
      }
    }
  })();
</script></main></body></html>
