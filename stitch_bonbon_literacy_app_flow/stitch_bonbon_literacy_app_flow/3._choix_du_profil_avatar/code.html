<script>
  (function () {
    const avatarOptions = document.querySelectorAll('.avatar-option');
    avatarOptions.forEach((option) => {
      option.addEventListener('click', () => {
        avatarOptions.forEach((btn) => {
          const ring = btn.querySelector('.avatar-ring');
          const badge = btn.querySelector('.avatar-badge');
          const label = btn.querySelector('span:last-child');
          ring.classList.remove('bg-primary', 'shadow-md');
          ring.classList.add('bg-surface-container');
          badge.classList.add('hidden');
          badge.classList.remove('flex');
          label.classList.remove('text-on-surface');
          label.classList.add('text-on-surface-variant');
        });

        const activeRing = option.querySelector('.avatar-ring');
        const activeBadge = option.querySelector('.avatar-badge');
        const activeLabel = option.querySelector('span:last-child');
        activeRing.classList.add('bg-primary', 'shadow-md');
        activeRing.classList.remove('bg-surface-container');
        activeBadge.classList.remove('hidden');
        activeBadge.classList.add('flex');
        activeLabel.classList.add('text-on-surface');
        activeLabel.classList.remove('text-on-surface-variant');
      });
    });

    const playPromptBtn = document.getElementById('play-prompt-btn');
    if (playPromptBtn) {
      playPromptBtn.addEventListener('click', () => {
        playPromptBtn.classList.add('scale-95');
        setTimeout(() => playPromptBtn.classList.remove('scale-95'), 180);
      });
    }
  })();
